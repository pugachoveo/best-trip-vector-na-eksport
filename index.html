<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вектор на экспорт — превью сайта</title>
<style>
@font-face{font-family:"Montserrat";font-weight:100 900;src:local("Montserrat"),url("fonts/Montserrat-VariableFont_wght.ttf") format("truetype")}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:"Montserrat",Arial,sans-serif;color:#0B3278;background:linear-gradient(180deg,#F7F9FC 0%,#EAEFF6 100%)}
.box{width:100%;max-width:440px;padding:48px 40px;border-radius:32px;background:#fff;box-shadow:0 30px 80px rgba(8,18,64,.12);display:flex;flex-direction:column;gap:24px}
.box img{width:220px;height:auto}
h1{font:700 22px/30px "Montserrat",Arial,sans-serif;color:#081240}
p{font:500 15px/22px "Montserrat",Arial,sans-serif;color:rgba(11,50,120,.68)}
input[type=password]{width:100%;height:56px;padding:0 18px;border:1.5px solid rgba(11,50,120,.12);border-radius:16px;font:500 17px/24px "Montserrat",Arial,sans-serif;color:#081240;background:#F7F9FC}
input[type=password]:focus{outline:none;border-color:#1E71EE;background:#fff}
label{display:flex;align-items:center;gap:10px;font:500 14px/20px "Montserrat",Arial,sans-serif;color:rgba(11,50,120,.68);cursor:pointer}
label input{width:20px;height:20px;accent-color:#1E71EE}
button{height:56px;border:0;border-radius:28px;background:#ED1C24;color:#fff;font:700 15px/20px "Montserrat",Arial,sans-serif;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;box-shadow:0 10px 30px rgba(237,28,36,.28)}
button:disabled{opacity:.6;cursor:default}
.err{color:#ED1C24;font-weight:600;min-height:22px}
form{display:flex;flex-direction:column;gap:16px}
</style>
</head>
<body>
<main class="box">
<img src="img/logos/vectornaexport_h_ru_color.svg" alt="Вектор на экспорт">
<div><h1>Превью сайта форума</h1><p>Введите пароль, чтобы открыть страницу.</p></div>
<form id="f">
<input id="pw" type="password" autocomplete="current-password" placeholder="Пароль" required autofocus>
<label><input id="rm" type="checkbox" checked>Запомнить на этом устройстве</label>
<button id="go" type="submit">Открыть</button>
<p class="err" id="err" role="alert"></p>
</form>
</main>

var K="vne-preview-key";
function bytes(s){var b=atob(s),u=new Uint8Array(b.length);for(var j=0;j<b.length;j++)u[j]=b.charCodeAt(j);return u}
function show(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(P.i)},k,bytes(P.c)).then(function(pt){var h=new TextDecoder().decode(pt);document.open();document.write(h);document.close()})}
function derive(pw){return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(b){return crypto.subtle.deriveKey({name:"PBKDF2",salt:bytes(P.s),iterations:P.n,hash:"SHA-256"},b,{name:"AES-GCM",length:256},true,["decrypt"])})}
function store(k){return crypto.subtle.exportKey("raw",k).then(function(r){try{localStorage.setItem(K,btoa(String.fromCharCode.apply(null,new Uint8Array(r))))}catch(e){}})}
var saved=null;try{saved=localStorage.getItem(K)}catch(e){}
function auto(){crypto.subtle.importKey("raw",bytes(saved),{name:"AES-GCM"},false,["decrypt"]).then(show).catch(function(){try{localStorage.removeItem(K)}catch(e){}})}
if(saved){if(document.readyState==="complete")auto();else window.addEventListener("load",auto)}
document.getElementById("f").addEventListener("submit",function(e){
e.preventDefault();var go=document.getElementById("go"),err=document.getElementById("err");
go.disabled=true;err.textContent="";
derive(document.getElementById("pw").value).then(function(k){
var rm=document.getElementById("rm").checked;
return crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(P.i)},k,bytes(P.c)).then(function(){return rm?store(k):null}).then(function(){return show(k)})
}).catch(function(){go.disabled=false;err.textContent="Неверный пароль"})
});
